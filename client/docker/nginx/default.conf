server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Service Worker: NUNCA pode ser cacheado pelo navegador/CDN.
    # Sem isso, o navegador pode continuar usando um sw.js antigo por dias,
    # e o app nunca recebe as atualizações do autoUpdate.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Manifest: cache curto é seguro (muda raramente, mas queremos que
    # atualizações de ícone/nome cheguem rápido se precisar).
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Arquivos do Workbox (registerSW.js, workbox-*.js): mesmo raciocínio do sw.js.
    location ~* ^/(registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Assets com hash no nome (JS/CSS gerados pelo Vite): esses SIM podem
    # ter cache longo e agressivo, porque o hash muda a cada build —
    # um arquivo com hash novo nunca é "a mesma versão antiga".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}