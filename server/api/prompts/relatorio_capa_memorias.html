<div class="pagina capa capa-memorias">
  <div class="capa-memorias-blob b1"></div>
  <div class="capa-memorias-blob b2"></div>

  <div class="capa-memorias-topo">
    <div class="capa-logo">{logo_escola_html}</div>
    <div class="capa-memorias-escola-nome">{escola_nome}</div>
    <div class="capa-memorias-kicker">{tipo_relatorio}</div>
    <div class="capa-memorias-nome-crianca">{nome_crianca}</div>
  </div>

  <div class="capa-memorias-foto-wrap">
    {foto_ou_placeholder_html}
  </div>

  <div class="capa-memorias-meta">
    <div class="capa-memorias-meta-item"><span class="icone">🎓</span><span class="rotulo">{turma_nome}</span></div>
    <div class="capa-memorias-meta-item"><span class="icone">📅</span><span class="rotulo">{periodo_label}</span></div>
    <div class="capa-memorias-meta-item"><span class="icone">🗓️</span><span class="rotulo">{ano_letivo}</span></div>
    <div class="capa-memorias-meta-item"><span class="icone">👩‍🏫</span><span class="rotulo">{professora_nome}</span></div>
  </div>

  <div class="capa-memorias-rodape">
    <div class="frase">Cada infância guarda um jeito<br>único de aprender e florescer.</div>
  </div>
</div>
