<div class="pagina capa capa-essencial">
  <div class="capa-essencial-band">
    <div class="marca">NARA<br>EDU</div>
  </div>

  <div class="capa-essencial-head">
    <div class="capa-logo">{logo_escola_html}</div>
    <div class="capa-essencial-escola-nome">{escola_nome}</div>
  </div>

  <div class="capa-essencial-bloco">
    <div class="capa-essencial-kicker">{tipo_relatorio}</div>
    <div class="capa-essencial-titulo">{titulo_relatorio}</div>
    <div class="capa-essencial-regua"><span class="linha"></span><span class="circulo"></span></div>
    <div class="capa-essencial-nome-crianca">{nome_crianca}</div>
  </div>

  <div class="capa-essencial-meta">
    <div class="capa-essencial-meta-item"><span class="rotulo">Turma</span><span class="valor">{turma_nome}</span></div>
    <div class="capa-essencial-meta-item"><span class="rotulo">Período</span><span class="valor">{periodo_label}</span></div>
    <div class="capa-essencial-meta-item"><span class="rotulo">Ano letivo</span><span class="valor">{ano_letivo}</span></div>
    <div class="capa-essencial-meta-item"><span class="rotulo">Data de geração</span><span class="valor">{data_geracao}</span></div>
  </div>

  <div class="capa-essencial-rodape">
    <div class="frase">Acompanhar com atenção. Registrar com sensibilidade.</div>
    <div class="site">naraedu.com.br</div>
  </div>
</div>
