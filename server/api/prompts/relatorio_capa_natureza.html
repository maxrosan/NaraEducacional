<div class="pagina capa capa-natureza">
  <div class="capa-natureza-head">
    <div class="capa-logo">{logo_escola_html}</div>
    <div class="capa-natureza-escola-nome">{escola_nome}</div>
  </div>

  <div class="capa-natureza-bloco">
    <div class="capa-natureza-kicker">{titulo_relatorio}</div>
    <div class="capa-natureza-titulo">{frase_destaque}</div>
    <div class="capa-natureza-nomerow">
      <span class="capa-natureza-nome-crianca">{nome_crianca}</span>
      {foto_circular_html}
    </div>
  </div>

  <div class="capa-natureza-meta">
    <div class="capa-natureza-meta-item"><span class="rotulo">{turma_nome}</span></div>
    <div class="capa-natureza-meta-item"><span class="rotulo">{periodo_label}</span></div>
    <div class="capa-natureza-meta-item"><span class="rotulo">{ano_letivo}</span></div>
    <div class="capa-natureza-meta-item"><span class="rotulo">{data_geracao}</span></div>
  </div>

  <div class="capa-natureza-rodape">
    <div class="frase">Cada descoberta revela novas possibilidades de aprender.</div>
  </div>
</div>
